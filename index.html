:root{--bg:#e9efed;--card:#fff;--ink:#10291f;--muted:#587068;--line:#cddad5;--pine:#14584a;--on:#fff;--amber:#cf8d12;--gold:#f8c010;--done:#1c9a68;--off:#d3ded9;--danger:#b3372f;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0b1714;--card:#13241f;--ink:#e4efeb;--muted:#8da79f;--line:#223630;--pine:#37b597;--on:#06241c;--amber:#f0b440;--done:#4cc994;--off:#25382f;--danger:#f0776d;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px}

/* logo */
.lt{fill:var(--pine)}
.lc{fill:var(--gold)}
.brand{display:flex;flex-direction:column;align-items:center}
.brand svg{display:block;width:210px;height:auto;overflow:visible}
.brand .rule{width:210px;height:2px;background:var(--gold);margin:8px 0 8px}
.brand .tag{font-size:.8rem;letter-spacing:.55em;padding-left:.55em;color:var(--muted)}
.brandbar{display:flex;align-items:flex-end;gap:10px}
.brandbar svg{display:block;height:36px;width:auto;overflow:visible}
.brandbar .tag{font-size:.68rem;letter-spacing:.3em;color:var(--muted);padding-bottom:1px}

/* header */
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .who{margin-left:auto;color:var(--muted);font-size:.9rem;max-width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:720px;margin:0 auto;padding:14px 16px 96px}

/* PIN gate */
.gate{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;text-align:center}
.gsub{color:var(--muted);margin:14px 0 26px}
.gate h1{font-size:1.1rem;font-weight:600;margin:0 0 16px}
.dots{display:flex;gap:14px;margin-bottom:6px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--pine);transition:background .12s}
.dots i.on{background:var(--pine)}
.dots.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.err{min-height:1.5em;max-width:300px;color:var(--danger);margin:4px 0 14px;font-size:.9rem}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:14px;justify-content:center}
.keys button{height:72px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.5rem;cursor:pointer;transition:transform .08s,background .08s}
.keys button:active{transform:scale(.92);background:var(--off)}
.extra{margin-top:14px}
.linkbtn{background:none;border:0;color:var(--pine);text-decoration:underline;padding:10px;cursor:pointer;font-size:.9rem}
.choose{display:grid;gap:10px;width:min(290px,100%)}
.big{padding:14px 18px;font-size:1.05rem;text-align:center}
.help{max-width:330px;color:var(--muted);margin:0 0 18px;text-align:left}

/* summary + pipeline */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:1.7rem;line-height:1.1}
.stat span{font-size:.82rem;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 13px;font-size:.88rem;cursor:pointer}
.chip[aria-pressed=true]{background:var(--pine);border-color:var(--pine);color:var(--on)}
.path{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(84px,1fr);overflow-x:auto;padding:4px 0 10px;margin-bottom:6px}
.stone{position:relative;background:none;border:0;padding:0 4px;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.stone::before{content:"";position:absolute;top:21px;right:50%;width:100%;height:3px;background:var(--off)}
.stone:first-child::before{display:none}
.orb{position:relative;z-index:1;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--card);border:2px solid var(--off);transition:transform .15s,background .15s}
.stone.has .orb{background:var(--amber);border-color:var(--amber);color:#1b1200}
.stone.has.end .orb{background:var(--done);border-color:var(--done);color:#06201a}
.stone[aria-pressed=true] .orb{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--pine);transform:scale(1.08)}
.lbl{font-size:.75rem;line-height:1.2;color:var(--muted);text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stone[aria-pressed=true] .lbl{color:var(--ink);font-weight:700}

/* forms + buttons */
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
#q{margin-bottom:10px}
.f{display:grid;gap:8px;margin-top:10px}
.row{display:flex;gap:8px;margin-top:10px;align-items:center}
.btn{background:var(--pine);color:var(--on);border:0;border-radius:10px;padding:11px 14px;font-weight:600;cursor:pointer;white-space:nowrap;display:inline-block}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 11px;font-size:.85rem;cursor:pointer}
.danger{background:none;border:1px solid var(--danger);color:var(--danger);border-radius:10px;padding:10px 14px;cursor:pointer;margin-top:12px}
.danger.armed{background:var(--danger);color:var(--bg)}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:10px}
.box summary{cursor:pointer;font-weight:600}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.h{font-size:1.15rem;margin:4px 0 10px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.card.tap{cursor:pointer;transition:border-color .15s,transform .1s}
.card.tap:hover{border-color:var(--pine)}
.card.tap:active{transform:scale(.99)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.unit{font-weight:700;font-size:1.05rem}
.name{color:var(--muted);font-size:.92rem;margin:2px 0 0}
.pill{font-size:.78rem;padding:2px 9px;border-radius:999px;background:var(--off);white-space:nowrap}
.card.done .pill{background:var(--done);color:#06201a}
.seg{display:flex;gap:3px;margin:10px 0 6px}
.seg i{flex:1;height:7px;border-radius:2px;background:var(--off)}
.seg i.on{background:var(--amber)}
.card.done .seg i.on{background:var(--done)}
.meta{color:var(--muted);font-size:.78rem}
.empty{text-align:center;color:var(--muted);padding:28px 8px}
.note{color:var(--muted);font-size:.82rem;margin:10px 0}
.note b{color:var(--ink)}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;padding:13px 4px;background:none;border:0;border-top:3px solid transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-current=page]{color:var(--pine);border-top-color:var(--pine);font-weight:700}

/* client sheet */
.sheet[hidden]{display:none}
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(5,15,12,.55);animation:fade .2s}
.panel{position:relative;width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));animation:up .24s ease-out}
.grab{width:42px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.ptop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ptop h2{margin:0;font-size:1.3rem}
.pct{display:flex;align-items:baseline;gap:10px;margin:14px 0 6px}
.pct b{font-size:2.1rem;line-height:1}
.pct span{color:var(--muted)}
.steps{list-style:none;margin:8px 0 16px;padding:0}
.steps li{position:relative}
.steps li button,.steps li>div{all:unset;box-sizing:border-box;display:flex;gap:14px;align-items:flex-start;width:100%;padding:8px 0}
.steps li button{cursor:pointer}
.steps li button:focus-visible{outline:2px solid var(--pine);outline-offset:2px;border-radius:8px}
.steps li::before{content:"";position:absolute;left:10px;top:32px;bottom:-8px;width:3px;background:var(--off);transition:background .3s}
.steps li:last-child::before{display:none}
.steps li.past::before{background:var(--amber)}
.node{flex:none;width:24px;height:24px;border-radius:50%;border:3px solid var(--off);background:var(--card);position:relative;z-index:1;transition:background .25s,border-color .25s,box-shadow .25s}
.steps li.past .node,.steps li.now .node{background:var(--amber);border-color:var(--amber)}
.steps li.now .node{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--amber)}
.steps.fin li::before{background:var(--done)}
.steps.fin .node{background:var(--done);border-color:var(--done)}
.steps.fin li.now .node{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--done)}
.st b{display:block;font-weight:600}
.st em{font-style:normal;color:var(--muted);font-size:.8rem}
.steps li:not(.past):not(.now) .st b{color:var(--muted);font-weight:500}
.fl{display:block;font-size:.85rem;color:var(--muted);margin:6px 0}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}

/* toast */
#toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,10px);max-width:88vw;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.pub{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--card);border:2px solid var(--amber);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.pub span{flex:1 1 160px;font-weight:600}
.btn:disabled{opacity:.6}
.welcome{background:var(--pine);color:var(--on);border-radius:14px;padding:16px 18px;margin-bottom:14px;border-left:6px solid var(--gold)}
.welcome span{display:block;font-size:.9rem;opacity:.9;position:relative;z-index:1}
.welcome b{display:block;font-size:1.45rem;line-height:1.2;margin-top:2px;position:relative;z-index:1;}
.warn{color:var(--danger);font-size:.85rem;margin:6px 0 0}
:root{--bar:#1c8a6e}
@media(prefers-color-scheme:dark){:root{--bar:#37b597}}
.chart{padding:14px}
.chead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:10px}
.chead>b{font-size:1rem}
.chead span{color:var(--muted);font-size:.85rem}
.chead span b{color:var(--ink);font-size:1rem}
.bars{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.bars li{display:grid;grid-template-columns:minmax(84px,38%) 1fr auto;align-items:center;gap:10px;padding:5px 4px;border-radius:6px}
.bars li:hover,.bars li:focus-visible{background:var(--off)}
.bl{font-size:.85rem;line-height:1.2;overflow-wrap:anywhere}
.bt{height:14px;display:block}
.bt i{display:block;height:14px;background:var(--bar);border-radius:0 4px 4px 0}
.bars li.blank .bt i{background:var(--muted);opacity:.45}
.bars li.blank .bl{color:var(--muted)}
.bv{font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.bv em{font-style:normal;color:var(--muted)}
:root{--flagbg:#fdeccb;--flagink:#6e4300}
@media(prefers-color-scheme:dark){:root{--flagbg:#3d2c09;--flagink:#f6cf7c}}
.flag{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--flagbg);color:var(--flagink);white-space:nowrap}
.flag>span{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--flagink);color:var(--flagbg);font-size:.7rem;font-weight:800}
.card .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stuckbar{margin:0 0 10px}
.chip.flagchip{background:var(--flagbg);border-color:var(--flagbg);color:var(--flagink);font-weight:600}
.chip.flagchip[aria-pressed=true]{background:var(--flagink);border-color:var(--flagink);color:var(--flagbg)}
.chip.flagchip>span{font-weight:800}
.sn{font-size:.85rem;margin:2px 0 6px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.since{color:var(--muted);font-size:.88rem;margin:0 0 6px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.snbox{background:var(--off);border-radius:10px;padding:10px 12px;margin:8px 0 6px}
.snbox b{font-size:.85rem}
.snbox p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.row.wrap{flex-wrap:wrap}
.card.cancel{opacity:.72}
.card.cancel .seg i.on{background:var(--muted)}
.card.cancel .unit{text-decoration:line-through;text-decoration-thickness:1px}
.cancelbox{background:var(--off);border-left:4px solid var(--muted);border-radius:8px;padding:9px 12px;margin:8px 0 10px;font-size:.92rem}
.stats.four{grid-template-columns:repeat(2,1fr)}
@media(min-width:540px){.stats.four{grid-template-columns:repeat(4,1fr)}}
.statbtn{font:inherit;color:inherit;text-align:left;cursor:pointer}
.statbtn[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.xnote{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:0 0 10px;color:var(--muted);font-size:.88rem}
:root{--hi:#1c8a6e;--lo:#d68f0f;--heroBg:#173b33;--heroInk:#ffffff;--heroGold:#f8c010}
@media(prefers-color-scheme:dark){:root{--hi:#37b597;--lo:#c9860b;--heroBg:#102c25}}
.box h3{font-size:1rem;margin:2px 0 10px}
.ihero{background:var(--heroBg);color:var(--heroInk);border-radius:16px;padding:20px 18px;margin-bottom:12px;text-align:center}
.ihero .eyebrow{display:block;font-size:.8rem;font-weight:700;letter-spacing:.08em}
.ihero .big{display:block;font-size:2.7rem;line-height:1.05;color:var(--heroGold);margin:6px 0 8px;letter-spacing:.01em}
.ihero p{margin:0 auto 14px;max-width:34ch;font-size:.92rem;opacity:.92}
.ihero .eff{display:inline-block;background:var(--heroGold);color:#1b1200;font-weight:700;font-size:.85rem;border-radius:10px;padding:7px 14px}
.calc input{font-size:1.2rem}
.eres{margin-top:10px}
.eamt{background:var(--off);border-radius:12px;padding:12px 14px}
.eamt span{display:block;font-size:.85rem;color:var(--muted)}
.eamt b{display:block;font-size:1.9rem;line-height:1.15;font-variant-numeric:tabular-nums}
.etag{font-size:.85rem;border-left:4px solid var(--hi);padding:4px 10px;margin:8px 0 0}
.etag.lo{border-left-color:var(--lo)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted);margin:-2px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .k{width:12px;height:12px;border-radius:3px;display:inline-block}
.k.hi{background:var(--hi)}.k.lo{background:var(--lo)}
.ebars li{grid-template-columns:96px 1fr 44px;padding:3px 4px}
.ebars .bt,.ebars .bt i{height:12px}
.ebars li.hi .bt i{background:var(--hi)}
.ebars li.lo .bt i{background:var(--lo)}
.ebars li.me{background:var(--off);box-shadow:inset 3px 0 0 var(--ink)}
.ebars li.me .bl,.ebars li.me .bv{font-weight:700}
.ebars .bv{text-align:right}
.why{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.why li{display:flex;gap:12px;align-items:flex-start}
.why .num{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:1.05rem;background:var(--lo);color:#1b1200}
.why li:nth-child(even) .num{background:var(--hi);color:#fff}
.why b{display:block;font-weight:600;line-height:1.3;padding-top:2px}
.why em{display:block;font-style:normal;color:var(--muted);font-size:.85rem}
.pay{display:grid;gap:10px}
@media(min-width:620px){.pay{grid-template-columns:repeat(3,1fr)}}
.pcard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.pcard h4{margin:0;padding:9px 12px;font-size:.92rem;text-align:center}
.pcard.gold h4{background:var(--heroGold);color:#1b1200}
.pcard.pine h4{background:var(--heroBg);color:#fff}
.pcard ul{margin:0;padding:10px 12px 12px 28px;font-size:.88rem;display:grid;gap:6px}
.consult{background:var(--flagbg);color:var(--flagink);border-radius:12px;padding:12px 14px}
.consult b{display:block;font-size:1.1rem}
.consult p{margin:4px 0 0;font-size:.9rem}
.btn.wa{display:inline-flex;align-items:center;gap:8px;background:#128c4a;color:#fff;text-decoration:none;margin-top:10px;padding:11px 16px}
.btn.wa svg{width:20px;height:20px;flex:none}
.btn.wa:hover{background:#0f7a40}
.contact .btn.wa{margin-top:4px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.lang button{background:none;border:0;color:var(--muted);font:inherit;font-size:.78rem;font-weight:700;padding:6px 9px;cursor:pointer;letter-spacing:.04em}
.lang button[aria-pressed=true]{background:var(--pine);color:var(--on)}
.gate{position:relative}
.gate>.lang{position:absolute;top:16px;right:16px}
.bar .who{margin-left:auto}
.bar .ghost{white-space:nowrap}
@media(max-width:440px){.bar .who{display:none}.bar .lang{margin-left:auto}}
.brandbar{gap:0;align-items:flex-end;flex:none}
.brandbar .rk{color:var(--pine);font-weight:500;font-size:17.4px;line-height:1;letter-spacing:.075em;margin-left:-22.4px;margin-bottom:-2.3px;position:relative;z-index:0}
.brandbar svg{position:relative;z-index:1}

.bhero{background:var(--heroBg);color:var(--heroInk);border-radius:18px;padding:18px 18px 22px;margin-bottom:12px;border-left:6px solid var(--heroGold)}
.bhtop{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-bottom:10px}
.beye{font-size:.74rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--heroGold)}
.bhero h2{margin:0 0 6px;font-size:1.55rem;line-height:1.18;text-wrap:balance}
.bhero p{margin:0;opacity:.92;font-size:.98rem}

econd (2) following month<\/b> if the first disbursement is made after the 15th of that month.":"若首次拨款于当月 15 日之后发放，则于<b>第二（2）个月<\/b>开始。","Types 2, 3 (landed), 6 and 7":"类型 2、3（有地房屋）、6 及 7","The <b>month following<\/b> the release of the 95% progress payment; or":"于 95% 进度款发放后的<b>下个月<\/b>开始；或","In the <b>25th month<\/b> from the approval date;":"自批准日期起的<b>第 25 个月<\/b>；","<b>Whichever is earlier.<\/b>":"<b>以较早者为准。<\/b>","Type 3 (high-rise)":"类型 3（高楼）","In the <b>following month<\/b> if the 95% progress payment is released on or before the 15th; or":"若 95% 进度款于 15 日或之前发放，则于<b>下个月<\/b>开始；或","In the <b>second (2) following month<\/b> if released after the 15th; or":"若于 15 日之后发放，则于<b>第二（2）个月<\/b>开始；或","In the <b>37th month<\/b> from the approval date;":"自批准日期起的<b>第 37 个月<\/b>；","Financing rate of 4% per annum":"每年 4% 融资利率","A set financing rate that supports long-term financial planning.":"固定的融资利率，有助长期财务规划。","Financing of up to 100%":"最高 100% 融资","Financing based on eligibility, the prescribed limits and the property valuation.":"融资额视资格、规定上限及房产估价而定。","Monthly salary deduction":"每月从薪金扣除","Structured repayment through salary or pension deductions.":"通过薪金或退休金扣除，还款更有条理。","Financing tenure of up to 35 years":"融资期限最长 35 年","A long financing tenure, subject to eligibility conditions and age limits.":"较长的融资期限，须符合资格条件及年龄限制。","Joint financing":"联名融资","An option for spouses who meet the joint financing requirements.":"符合联名融资条件的配偶可选择此方式。","A wide range of property purposes":"多种房产用途","Covers completed homes, homes under construction, building a home on your own land and other permitted purposes.":"涵盖已完工房屋、建设中房屋、在自有土地上建屋及其他获准用途。","Shariah-compliant financing option":"符合伊斯兰教法的融资选择","Housing financing based on Shariah principles is available.":"提供基于伊斯兰教法原则的房屋融资。","Copy of identity card (MyKad)":"身份证（MyKad）副本","Front and back.":"正面及背面。","Payslips":"薪金单","The latest three (3) months.":"最近三（3）个月。","Letter of confirmation in service":"职位确认信","A copy of your service confirmation letter.":"您的职位确认信副本。","Can this financing be used for a new project home that is still under construction?":"此融资可用于仍在建设中的新项目房屋吗？","Yes. Buying a home under construction from a developer is one of the permitted financing types.":"可以。向发展商购买建设中的房屋是获准的融资类型之一。","Do I pay instalments while the home is being built?":"房屋建设期间需要缴付分期付款吗？","There are no progressive payments for projects under construction. For landed homes, repayment begins in the month after the 95% progress payment is released, or in the 25th month from the approval date, whichever is earlier. For high-rise homes, that limit is the 37th month.":"建设中的项目无需渐进式付款。有地房屋于 95% 进度款发放后的下个月开始还款，或自批准日期起的第 25 个月开始，以较早者为准。高楼住宅的期限则为第 37 个月。","Who is eligible to apply?":"谁有资格申请？","Permanent public servants who have been confirmed in service. Public servants serving on contract are not eligible.":"已获职位确认的长期公务员。合约制公务员不符合资格。","Can I apply jointly with my spouse?":"我可以与配偶联名申请吗？","Yes. Joint financing is open to spouses, or a parent and their biological child, for the same property. A spouse working in the private sector may use a bank as the second financier for a completed home or a home under construction, subject to conditions. All applicants use the same lawyer.":"可以。联名融资开放给夫妻，或父母与亲生子女，用于同一房产。在私人界工作的配偶，可就已完工或建设中的房屋以银行作为第二融资方，须符合条件。所有申请人须委托同一位律师。","Are legal fees and stamp duty financed?":"律师费和印花税可以包括在融资内吗？","Legal fees for the financing documents can be included in the financing amount (optional). The financing documents are exempt from stamp duty. Costs for the Sale and Purchase Agreement, transfer, caveat and their stamp duty are not included in the financing.":"融资文件的律师费可纳入融资额（可选择）。融资文件豁免印花税。买卖协议、产权转移、产业限制令（caveat）的费用及其印花税不包括在融资内。","Is insurance or takaful coverage required?":"需要保险或伊斯兰保险（takaful）保障吗？","Yes. Conventional financing comes with insurance, while Islamic financing comes with takaful. The insurance or takaful panel cannot be changed after the financing is approved.":"需要。传统融资附带保险，伊斯兰融资则附带 takaful。融资获批后，保险或 takaful 指定机构不可更换。","What if the project is delayed or abandoned?":"如果项目延误或被废弃怎么办？","If the project is confirmed as abandoned, problematic or delayed by the housing ministry, the borrower may apply to reschedule repayments or cancel the financing, with the letter confirming the project status.":"若项目经房屋部确认为废弃、有问题或延误，借款人可凭项目状态确认信，申请重新安排还款或取消融资。","Can I apply for a second financing?":"我可以申请第二次融资吗？","It may be considered if the first financing has been fully settled and the monthly instalment does not exceed 50% of the current basic salary.":"若第一次融资已全数还清，且每月分期付款不超过现有基本薪金的 50%，可获考虑。","Application submitted":"申请已提交","Documents complete":"文件齐全","Under review":"审核中","Financing approved":"融资已批准","Financing agreement":"融资协议","Teacher":"教师","Lecturer":"讲师","Police (PDRM)":"警察（PDRM）","Armed Forces (ATM)":"武装部队（ATM）","Fire and Rescue":"消防与拯救","Nurse":"护士","Doctor / Medical Officer":"医生／医务官","Administrative Assistant":"行政助理","Administrative Officer":"行政官员","Customs":"关税局","Immigration":"移民局","Other civil servant":"其他公务员","Not specified":"未注明","Others":"其他","Above 10,000":"10,000 以上","above RM10,000":"RM10,000 以上"," to ":" 至 ","Exit display mode":"退出展示模式","Info":"资讯","Ask for status on WhatsApp":"通过 WhatsApp 询问进度","Hello, may I have a status update for Unit {0} ({1})? Thank you.":"您好，请问单位 {0}（{1}）的申请进度如何？谢谢。","Message copied. Paste it in WhatsApp and send.":"信息已复制。请在 WhatsApp 中粘贴并发送。","Open WhatsApp and type: {0}":"请打开 WhatsApp 并输入：{0}","Process performance":"流程表现","Average time at each stage":"各阶段平均所需时间","{0} days":"{0} 天","< 1 day":"不足 1 天","Based on actual client movements in this project.":"根据本项目客户的实际进度计算。","Applications completed each month":"每月完成的申请","Last 6 months":"最近 6 个月","Updated this week ({0})":"本周已更新（{0}）","Your clients’ status":"您的客户状态","The summary and progress ring show where every application in your project stands.":"摘要和进度环显示您项目中每份申请的最新状况。","Tap a client card":"点击客户卡片","See the details, the timeline of each stage and notes from the admin.":"查看详情、各阶段时间线及管理员备注。","The Benefits tab":"“优势”页面","Show walk-in clients the financing benefits using Display mode.":"使用展示模式，向上门客户介绍融资优势。","Skip":"跳过","Next":"下一步","Get started":"开始使用","Step {0} of 3":"第 {0} 步，共 3 步"};

const te=new TextEncoder(),td=new TextDecoder();

  const dots=()=>[...$('dots').children].forEach((d,i)=>d.classList.toggle('on',i<v.length));

    if(busy)return;
    if(Date.now()<lockUntil){$('err').textContent=t('many');return}

    if(!/^\d$/.test(k)||v.length>=4)return;
    v+=k;dots();$('err').textContent='';
    if(v.length===4){
      const pin=v;busy=true;$('err').textContent=t('checking');const gt=document.querySelector('.gate');if(gt)gt.classList.add('busy');
      setTimeout(async()=>{
        let r;try{r=await done(pin)}catch(e){r='Ralat. Cuba lagi.'}
        busy=false;{const gt=document.querySelector('.gate');if(gt)gt.classList.remove('busy')}

      },60);
    }
  };
  padKey=press;
  document.querySelector('.keys').onclick=e=>{const b=e.target.closest('button');if(b)press(b.dataset.k)};
}

  return null;
}

function jobChart(sc){
  if(!sc.length)return '';
  const m=new Map();sc.forEach(c=>{const k=jobOf(c);m.set(k,(m.get(k)||0)+1)});
  let rows=[...m.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
  const blank=rows.find(r=>r[0]==='Belum diisi');rows=rows.filter(r=>r[0]!=='Belum diisi');
  if(rows.length>7){const rest=rows.slice(6).reduce((s,r)=>s+r[1],0);rows=rows.slice(0,6).concat([['Lain-lain',rest]])}
  if(blank)rows.push(blank);
  const max=Math.max(...rows.map(r=>r[1])),tot=sc.length;
  const nx=sc.filter(c=>c.x).length;
  return `<section class="box chart" aria-label="${t('jobs')}"><div class="chead"><b>${t('jobs')}</b><span>${t('totApps')} <b>${tot}</b>${nx?t('inclX',nx):''}</span></div><ul class="bars">${rows.map(([k,v])=>{const pct=Math.round(v/tot*100),lab=jobT(k);return `<li tabindex="0" title="${esc(lab)}: ${v} ${t('apps')} (${pct}%)"${k==='Belum diisi'?' class="blank"':''}><span class="bl">${esc(lab)}</span><span class="bt"><i style="width:${Math.max(2,v/max*100).toFixed(1)}%"></i></span><span class="bv">${v} <em>(${pct}%)</em></span></li>`}).join('')}</ul></section>`;
}

['Adakah kos guaman dan duti setem dibiayai?','Yuran guaman bagi dokumen pembiayaan boleh dimasukkan ke dalam jumlah pembiayaan (pilihan). Dokumen pembiayaan dikecualikan duti setem. Kos Perjanjian Jual Beli, pindah milik, kaveat dan duti setemnya tidak termasuk dalam pembiayaan.'],
['Adakah perlindungan insurans atau takaful diperlukan?','Ya. Pembiayaan konvensional disertai insurans, manakala pembiayaan Islam disertai takaful. Panel insurans atau takaful tidak boleh ditukar selepas pembiayaan diluluskan.'],
['Bagaimana jika projek lewat siap atau terbengkalai?','Jika projek disahkan terbengkalai, bermasalah atau sakit oleh kementerian perumahan, peminjam boleh memohon penjadualan semula bayaran balik atau pembatalan pembiayaan dengan surat pengesahan status projek tersebut.'],
['Bolehkah saya memohon pembiayaan kali kedua?','Boleh dipertimbangkan jika pembiayaan pertama telah diselesaikan sepenuhnya dan ansuran bulanan tidak melebihi 50% daripada gaji hakiki semasa.']],
en:[['Can this financing be used for a new project home that is still under construction?','Yes. Buying a home under construction from a developer is one of the permitted financing types.'],
['Do I pay instalments while the home is being built?','There are no progressive payments for projects under construction. For landed homes, repayment begins in the month after the 95% progress payment is released, or in the 25th month from the approval date, whichever is earlier. For high-rise homes, that limit is the 37th month.'],
['Who is eligible to apply?','Permanent public servants who have been confirmed in service. Public servants serving on contract are not eligible.'],
['Can I apply jointly with my spouse?','Yes. Joint financing is open to spouses, or a parent and their biological child, for the same property. A spouse working in the private sector may use a bank as the second financier for a completed home or a home under construction, subject to conditions. All applicants use the same lawyer.'],
['Are legal fees and stamp duty financed?','Legal fees for the financing documents can be included in the financing amount (optional). The financing documents are exempt from stamp duty. Costs for the Sale and Purchase Agreement, transfer, caveat and their stamp duty are not included in the financing.'],
['Is insurance or takaful coverage required?','Yes. Conventional financing comes with insurance, while Islamic financing comes with takaful. The insurance or takaful panel cannot be changed after the financing is approved.'],
['What if the project is delayed or abandoned?','If the project is confirmed as abandoned, problematic or delayed by the housing ministry, the borrower may apply to reschedule repayments or cancel the financing, with the letter confirming the project status.'],
['Can I apply for a second financing?','It may be considered if the first financing has been fully settled and the monthly instalment does not exceed 50% of the current basic salary.']]};

  const c=S.clients.find(x=>x.id===openId);if(!c||$('sheet').hidden)return;
  const L=last(),s=Math.min(c.s,L);
  $('sheet').querySelectorAll('.steps li').forEach((li,i)=>{li.className=i<s?'past':i===s?'now':'';li.querySelector('em').textContent=dateFor(c,i)});
  $('sheet').querySelector('.steps').classList.toggle('fin',s>=L);
  $('pctn').textContent=Math.round(s/L*100)+'%';$('pctl').textContent=stg(s);
  if($('since'))$('since').innerHTML=sinceText(c);
}
function sinceText(c){
  if(c.s>=last())return t('sinceDone',esc(fmt(stageSince(c))));
  return t('since',esc(fmt(stageSince(c))),daysAt(c))+(isStuck(c)?` <span class="flag"><span aria-hidden="true">!</span> ${t('stuck')}</span>`:'');
}
function openSheet(id){openId=id;renderSheet();document.body.style.overflow='hidden';const b=$('sheet').querySelector('.ghost');if(b)b.focus()}
function closeSheet(){openId=null;const el=$('sheet');el.hidden=true;el.innerHTML='';document.body.style.overflow=''}

/* ---------- teks untuk disalin ---------- */
function showText(title,text,hint){
  const el=$('sheet');el.hidden=false;document.body.style.overflow='hidden';
  el.innerHTML=`<div class="scrim" data-act="close"></div><div class="panel" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grab"></div><div class="ptop"><h2>${esc(title)}</h2><button class="ghost" data-act="close">Tutup</button></div><p class="name">${esc(hint)}</p><textarea id="tx" rows="9" readonly></textarea><div class="row"><button class="btn" data-act="copytx">Salin</button></div><p class="note" id="txn"></p></div>`;
  $('tx').value=text;
}
function copyTx(){
  const t=$('tx');t.focus();t.select();t.setSelectionRange(0,t.value.length);
  const ok=()=>{$('txn').textContent='Disalin. Buka WhatsApp dan tampal (tekan lama, pilih Tampal).'};
  const no=()=>{$('txn').textContent='Tidak dapat salin automatik. Teks sudah dipilih: tekan lama pada teks, kemudian pilih Salin.'};
  let done=false;try{done=document.execCommand('copy')}catch(e){}
  if(done){ok();return}
  if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(ok,no);else no();
}
const isAdmin=()=>me&&me.role==='admin';
function invite(id){
  if(!isAdmin())return;const d=S.devs.find(x=>x.id===id);if(!d)return;
  const link=S.link||(LINK.indexOf('__')===0?'(link belum tersedia)':LINK);
  showText('Jemputan untuk '+d.name,['Salam. Ini link TULUS TRACKER untuk semak status proses perumahan klien '+d.name+':','',link,'','Tekan link, kemudian masukkan PIN 4 angka yang saya hantar berasingan. Link ini dikemas kini setiap kali ada perubahan, jadi simpan untuk semakan akan datang.'].join('\n'),'Salin dan hantar dalam WhatsApp. Hantar PIN ('+d.pin+') dalam mesej berasingan.');
}
function statusMsg(id){
  if(!isAdmin())return;
  const d=S.devs.find(x=>x.id===id);if(!d)return;
  const cl=S.clients.filter(c=>c.dev===id),L=last();
  const lines=['*TULUS TRACKER*','Status proses perumahan: '+d.name,'Dikemas kini '+fmt(Date.now()),''];
  if(!cl.length)lines.push('Belum ada klien.');
  cl.forEach(c=>{const s=Math.min(c.s,L);if(c.x){lines.push('• '+c.u+(c.n&&c.n!=='-'?' ('+c.n+')':'')+': DIBATALKAN');return}lines.push('• '+c.u+(c.n&&c.n!=='-'?' ('+c.n+')':'')+': '+S.stages[s]+' ['+(s+1)+'/'+(L+1)+']'+(isStuck(c)?' (tersangkut '+daysAt(c)+' hari)':''));if(c.sn)lines.push('   Catatan: '+c.sn)});
  const nx=cl.filter(c=>c.x).length;
  lines.push('','Jumlah: '+(cl.length-nx)+' klien aktif, '+cl.filter(c=>!c.x&&c.s>=L).length+' selesai'+(nx?', '+nx+' dibatalkan':'')+'.');
  showText('Mesej untuk '+d.name,lines.join('\n'),'Salin mesej ini dan tampal dalam WhatsApp pemaju/agency. Tiada PIN diperlukan.');
}

/* ---------- terbitkan data pemaju ---------- */
function pageSource(pubText){
  const reset=[...document.head.querySelectorAll('style')].map(s=>s.textContent).join('');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'
    +'<title>TULUS TRACKER</title><style id="css">'+$('css').textContent+'</style>'
    +'<div id="app"></div><div id="sheet" class="sheet" hidden></div><div id="toast" role="status" aria-live="polite"></div>'
    +'<script id="pub" type="application/json">'+pubText+'<\/script><script id="main">'+$('main').textContent+'<\/script></body></html>';
}
async function publishNow(btn){
  if(!isAdmin())return;
  if(!ART){toast('Kemas kini hanya boleh dibuat dalam app Claude, sebagai pemilik.');return}
  if(btn){btn.disabled=true;btn.textContent='Mengemas kini…'}
  try{
    const at=Date.now(),salt=crypto.getRandomValues(new Uint8Array(16)),blobs=[];
    for(const d of S.devs){
      const key=await kdf(d.pin,salt,ITER);
      const cl=S.clients.filter(c=>c.dev===d.id).map(c=>({u:c.u,n:c.n,j:c.j||'',sn:c.sn||'',x:!!c.x,xt:c.xt||0,s:c.s,log:c.log||[],d:c.d}));
      blobs.push(await seal({dev:d.name,stages:S.stages,clients:cl,at,stuck:STUCK()},key));
    }
    for(let i=blobs.length-1;i>0;i--){const j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1);[blobs[i],blobs[j]]=[blobs[j],blobs[i]]}
    const pub=JSON.stringify({v:2,salt:b64(salt),it:ITER,b:blobs}).replace(/</g,'\\u003c');
    S.dirty=false;S.pubAt=at;await flush();
    ss.set('tt-admin',String(Date.now()+10*60*1000));ss.set('tt-pub','1');
    await ART.publish(pageSource(pub));
  }catch(e){
    const c=e&&e.code;
    if(c==='conflict')return;
    S.dirty=true;flush();ss.del('tt-pub');
    if(btn){btn.disabled=false;btn.textContent='Kemas kini untuk pemaju'}
    toast(c==='not_writer'||c==='not_granted'||c==='capability_disabled'||c==='not_declared'?'Hanya pemilik boleh kemas kini, dalam app Claude.':c==='rate_limited'?'Terlalu kerap. Cuba lagi selepas seminit.':c==='too_large'?'Data terlalu besar. Padam klien yang sudah selesai.':'Kemas kini gagal. Cuba lagi.');
  }
}

/* ---------- tindakan admin ---------- */
function setStage(i){
  if(!isAdmin())return;
  const c=S.clients.find(x=>x.id===openId);if(!c||c.x||i===c.s)return;
  c.s=i;c.d=Date.now();(c.log=c.log||[]).push({s:i,t:c.d});touch();paintSheet();render();
}
function addClient(){
  if(!isAdmin())return;
  if(!S.devs.length){toast('Tambah pemaju/agency dahulu di tab Pemaju/Agency.');return}
  const dv=$('cd').value,u=$('cu').value.trim(),n=$('cn').value.trim(),j=$('cj').value.trim().slice(0,60);
  if(!u){$('cu').focus();toast('Isi no. unit.');return}
  const t=Date.now();S.clients.unshift({id:uid(),dev:dv,u,n:n||'-',j,s:0,log:[{s:0,t}],note:'',d:t});
  if(fDev)fDev=dv;touch();render();toast('Klien ditambah.');
}
function delClient(){
  if(!isAdmin())return;
  const c=S.clients.find(x=>x.id===openId);if(!c)return;
  S.clients=S.clients.filter(x=>x!==c);touch();closeSheet();render();toast('Klien dipadam.');
}
function pinOK(p,exceptId){
  if(!/^\d{4}$/.test(p)){toast('PIN mesti 4 angka.');return false}
  if(weakPin(p)){toast('PIN ini terlalu mudah diteka. Elakkan 0000, 1234 dan seumpamanya.');return false}
  if(hp(p)===S.admin||S.devs.some(d=>d.pin===p&&d.id!==exceptId)){toast('PIN ini sudah digunakan. Pilih PIN lain.');return false}
  return true;
}
function addDev(){
  if(!isAdmin())return;
  const n=$('dn').value.trim(),p=$('dp').value.trim();
  if(!n){$('dn').focus();toast('Isi nama pemaju/agency.');return}
  if(!pinOK(p))return;
  S.devs.push({id:uid(),name:n,pin:p});touch();render();toast('Pemaju/agency ditambah.');
}
function chPin(id){
  if(!isAdmin())return;
  const p=$('np-'+id).value.trim();if(!pinOK(p,id))return;
  S.devs.find(d=>d.id===id).pin=p;touch();render();toast('PIN ditukar. Tekan “Kemas kini untuk pemaju”, kemudian beritahu PIN baharu.');
}
function delDev(id){
  if(!isAdmin())return;
  S.devs=S.devs.filter(d=>d.id!==id);S.clients=S.clients.filter(c=>c.dev!==id);if(fDev===id)fDev='';
  touch();render();toast('Pemaju/agency dan klien dipadam.');
}
function chAdmin(){
  if(!isAdmin())return;
  const p=$('ap').value.trim();
  if(!/^\d{4}$/.test(p)){toast('PIN mesti 4 angka.');return}
  if(weakPin(p)){toast('PIN ini terlalu mudah diteka. Pilih PIN lain.');return}
  if(S.devs.some(d=>d.pin===p)){toast('PIN ini sudah digunakan oleh pemaju/agency.');return}
  S.admin=hp(p);save();render();toast('PIN admin ditukar.');
}
function saveStages(){
  if(!isAdmin())return;
  const t=$('st').value.split('\n').map(x=>x.trim()).filter(Boolean);
  if(t.length<2){toast('Letak sekurang-kurangnya 2 tahap.');return}
  S.stages=t;S.clients.forEach(c=>{c.s=Math.min(c.s,t.length-1)});fStage=-1;touch();render();toast('Tahap disimpan.');
}
function wipe(){if(!isAdmin())return;S.clients=[];S.devs=[];fDev='';fStage=-1;touch();render();toast('Semua pemaju/agency dan klien dipadam.')}
function backupText(){if(isAdmin())showText('Backup (teks)',JSON.stringify({admin:S.admin,stages:S.stages,devs:S.devs,clients:S.clients,stuckDays:STUCK()}),'Salin dan simpan di tempat selamat, contohnya Notes. Teks ini mengandungi semua data dan PIN pemaju/agency, jadi jangan hantar kepada orang lain.')}
function importData(raw){
  if(!isAdmin())return;
  try{const n=normalize(JSON.parse(raw));if(!n)throw 0;
    S={admin:n.admin||S.admin,stages:n.stages,devs:n.devs,clients:n.clients,dirty:true,pubAt:S.pubAt,link:S.link,stuckDays:raw.indexOf('"stuckDays"')>=0?n.stuckDays:S.stuckDays};
    fDev='';fStage=-1;save();render();toast('Backup dipulihkan. Tekan “Kemas kini untuk pemaju” bila sedia.');
  }catch(x){toast('Backup tidak sah. Pastikan semua teks disalin.')}
}
function saveLink(){
  if(!isAdmin())return;
  let v=$('lk').value.trim();
  if(v&&!/^https?:\/\//i.test(v))v='https://'+v;
  if(v&&!okLink(v)){toast('Link tidak sah. Mesti bermula dengan https://');return}
  S.link=v;save();render();toast(v?'Link disimpan. “Salin jemputan” kini guna link ini.':'Link pendek dibuang. Link asal digunakan.');
}
function setCancel(on){
  if(!isAdmin())return;
  const c=S.clients.find(x=>x.id===openId);if(!c||!!c.x===on)return;
  c.x=on;c.xt=on?Date.now():0;touch();renderSheet();if($('list'))render(),renderSheet();
  toast(on?'Permohonan dibatalkan. Ia disorok dari senarai biasa; lihat di “Dibatalkan”.':'Permohonan diaktifkan semula.');
}
function renDev(id){
  if(!isAdmin())return;
  const d=S.devs.find(x=>x.id===id);if(!d)return;
  const v=$('nn-'+id).value.trim().slice(0,80);
  if(!v){toast('Isi nama baharu.');return}
  if(v===d.name)return;
  d.name=v;touch();render();toast('Nama ditukar. Tekan “Kemas kini untuk pemaju” supaya mereka nampak nama baharu.');
}
function saveStuck(){
  if(!isAdmin())return;
  const v=Math.floor(+$('sd').value);
  if(!(v>=1&&v<=365)){toast('Masukkan bilangan hari antara 1 dan 365.');return}
  S.stuckDays=v;touch();render();toast('Had tersangkut ditetapkan '+v+' hari.');
}
const thisMonth=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
/* Laporan bulanan dalam teks biasa, sedia untuk WhatsApp. */
function report(devId,ym){
  if(!isAdmin())return;
  if(!S.devs.length){toast('Belum ada pemaju/agency.');return}
  if(!/^\d{4}-\d{2}$/.test(ym))ym=thisMonth();
  const [Y,M]=ym.split('-').map(Number),from=new Date(Y,M-1,1).getTime(),to=new Date(Y,M,1).getTime();
  const name=new Date(Y,M-1,1).toLocaleDateString('ms-MY',{month:'long',year:'numeric'});
  const L=last(),inM=t=>t>=from&&t<to,devs=devId?S.devs.filter(d=>d.id===devId):S.devs;
  const lines=['*TULUS TRACKER*','Laporan bulanan: '+name,'Dijana '+fmt(Date.now())];
  devs.forEach(d=>{
    const cl=S.clients.filter(c=>c.dev===d.id);
    const baru=cl.filter(c=>inM(created(c)));
    const selesai=cl.filter(c=>(c.log||[]).some(e=>e.s===L&&inM(e.t)));
    const gerak=cl.filter(c=>(c.log||[]).some(e=>e.s>0&&inM(e.t))).length;
    const aktif=cl.filter(c=>!c.x&&c.s<L);
    const batal=cl.filter(c=>c.x&&inM(c.xt));
    const stuck=aktif.filter(isStuck);
    lines.push('','*'+d.name+'*',
      '• Permohonan baharu: '+baru.length,
      '• Bergerak ke tahap seterusnya: '+gerak,
      '• Selesai: '+selesai.length,
      '• Masih dalam proses (hari ini): '+aktif.length,
      '• Tersangkut lebih '+STUCK()+' hari (hari ini): '+stuck.length+(stuck.length?' ('+stuck.map(c=>c.u).join(', ')+')':''),
      '• Dibatalkan: '+batal.length+(batal.length?' ('+batal.map(c=>c.u).join(', ')+')':''),
      '• Jumlah keseluruhan: '+cl.length+' (termasuk dibatalkan)');
    if(baru.length){const m=new Map();baru.forEach(c=>m.set(jobOf(c),(m.get(jobOf(c))||0)+1));lines.push('• Pekerjaan permohonan baharu: '+[...m].sort((a,b)=>b[1]-a[1]).map(([k,v])=>k+' '+v).join(', '))}
    const byStage=S.stages.map((t,i)=>[t,cl.filter(c=>!c.x&&c.s===i).length]).filter(r=>r[1]);
    if(byStage.length)lines.push('• Tahap semasa: '+byStage.map(([t,v])=>t+' '+v).join(', '));
  });
  showText('Laporan '+name,lines.join('\n'),devId?'Salin dan hantar kepada pemaju/agency ini dalam WhatsApp.':'Laporan semua pemaju/agency, untuk rujukan anda. Pilih satu pemaju/agency untuk laporan yang boleh dihantar kepada mereka.');
}
function restoreText(){const v=$('rt').value.trim();if(!v){toast('Tampal teks backup dahulu.');return}importData(v)}
function restore(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importData(r.result);r.readAsText(f)}
function summary(){
  if(!isAdmin())return;
  const lines=['TULUS TRACKER ('+fmt(Date.now())+')'];
  S.devs.forEach(d=>{const cl=S.clients.filter(c=>c.dev===d.id&&!c.x),nx=S.clients.filter(c=>c.dev===d.id&&c.x).length;lines.push('',d.name+': '+cl.length+' klien aktif'+(nx?', '+nx+' dibatalkan':''));S.stages.forEach((t,i)=>{const n=cl.filter(c=>c.s===i).length;if(n)lines.push('- '+t+': '+n)})});
  showText('Ringkasan',lines.join('\n'),'Ringkasan semua pemaju/agency, untuk rujukan anda.');
}
function act(a,b){
  const d=b.dataset;
  switch(a){
    case 'out':ss.del('tt-admin');flush();start();break;
    case 'lang':if(d.v!==LANG){LANG=['ms','en','zh'].includes(d.v)?d.v:'en';try{localStorage.setItem('tt-lang',LANG)}catch(e){}const keepInc=$('inc')?$('inc').value:'';const wasOpen=openId;if(me){render();if(wasOpen){openSheet(wasOpen)}if(keepInc&&$('inc')){$('inc').value=keepInc;updateElig()}}else start()}break;
    case 'setup':if(OWNER&&LOADED&&!S.admin)setup();break;
    case 'tab':tab=d.v;render();window.scrollTo(0,0);break;
    case 'present':if(document.body.classList.contains('present'))presentOff();else presentOn();break;
    case 'fdev':fDev=d.v;fStage=-1;render();break;
    case 'fstage':fStage=fStage===+d.v?-1:+d.v;render();break;
    case 'fstuck':fStage=fStage===-2?-1:-2;render();break;
    case 'fweek':fStage=fStage===-4?-1:-4;render();break;
    case 'ask':askStatus();break;
    case 'gnext':guideStep(+d.v);break;
    case 'gdone':guideDone();break;
    case 'fcancel':fStage=fStage===-3?-1:-3;render();break;
    case 'cancelc':setCancel(true);break;
    case 'reactc':setCancel(false);break;
    case 'rendev':renDev(d.id);break;
    case 'savestuck':saveStuck();break;
    case 'report':report(($('rd')||{}).value||'',($('rm')||{}).value||'');break;
    case 'reportdev':report(d.id,'');break;
    case 'open':{const had=!!NEWS[d.id];markSeen(d.id);openSheet(d.id);if(had&&$('list')){relist();const nb=document.querySelector('.news');if(nb)nb.outerHTML=newsBar()}}break;
    case 'seenall':markAllSeen();render();break;
    case 'theme':toggleTheme();break;
    case 'a2hsx':try{localStorage.setItem('tt-a2hs','0')}catch(e){}{const el=document.querySelector('.a2hs');if(el)el.remove()}break;
    case 'a2hsgo':if(A2HS){A2HS.prompt();A2HS.userChoice&&A2HS.userChoice.then(()=>{A2HS=null;const el=document.querySelector('.a2hs');if(el)el.remove()}).catch(()=>{})}break;
    case 'close':closeSheet();if(me&&VIEW==='app'&&tab==='klien'&&$('list'))relist();break;
    case 'stage':setStage(+d.i);break;
    case 'addc':addClient();break;
    case 'delc':delClient();break;
    case 'adddev':addDev();break;
    case 'chpin':chPin(d.id);break;
    case 'deld':delDev(d.id);break;
    case 'invite':invite(d.id);break;
    case 'msg':statusMsg(d.id);break;
    case 'publish':publishNow(b);break;
    case 'savest':saveStages();break;
    case 'adminpin':chAdmin();break;
    case 'sum':summary();break;
    case 'bakt':backupText();break;
    case 'rest':restoreText();break;
    case 'copytx':copyTx();break;
    case 'savelink':saveLink();break;
    case 'copyorig':if(isAdmin())showText('Link asal',LINK,'Tampal link ini dalam TinyURL atau pemendek link lain untuk buat link pendek.');break;
    case 'wipe':wipe();break;
  }
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  if(b.hasAttribute('data-confirm')&&!b.dataset.armed){
    b.dataset.armed='1';b._t=b.textContent;b.textContent=b.dataset.confirm||'Tekan sekali lagi untuk padam';b.classList.add('armed');
    setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=b._t;b.classList.remove('armed')}},4000);
    return;
  }
  act(b.dataset.act,b);
});
document.addEventListener('keydown',e=>{
  if(padKey){if(/^\d$/.test(e.key))padKey(e.key);else if(e.key==='Backspace')padKey('⌫');return}
  if(e.key==='Escape'&&!$('sheet').hidden)closeSheet();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[data-act="open"]')){e.preventDefault();act('open',e.target)}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){q=e.target.value;relist()}
  else if(e.target.id==='inc')updateElig();
  else if(e.target.id==='note'){const c=S.clients.find(x=>x.id===openId);if(c){c.note=e.target.value;save()}}
  else if(e.target.id==='sn'&&isAdmin()){const c=S.clients.find(x=>x.id===openId);if(c){c.sn=e.target.value.slice(0,300);touch();if($('list'))relist()}}
});
document.addEventListener('change',e=>{
  if(e.target.id==='sort'){SORT=e.target.value;try{localStorage.setItem('tt-sort',SORT)}catch(x){}if($('list')){relist()}}
  else if(e.target.id==='res')restore(e.target);
  else if((e.target.id==='eu'||e.target.id==='en')&&isAdmin()){
    const c=S.clients.find(x=>x.id===openId);if(!c)return;
    const v=e.target.value.trim().slice(0,e.target.id==='eu'?40:80);
    if(e.target.id==='eu'){if(!v){e.target.value=c.u;toast('No. unit tidak boleh kosong.');return}if(v===c.u)return;c.u=v;$('sheet').querySelector('.ptop h2').textContent=v}
    else{const nv=v||'-';if(nv===c.n)return;c.n=nv;$('sheet').querySelector('.ptop .name').textContent=nv}
    touch();if($('list'))relist();toast('Disimpan.');
  }
  else if(e.target.id==='job'&&isAdmin()){const c=S.clients.find(x=>x.id===openId);const v=e.target.value.trim().slice(0,60);if(c&&v!==(c.j||'')){c.j=v;touch();render();toast('Pekerjaan disimpan.')}}
});
window.addEventListener('pagehide',()=>{if(isAdmin())flush()});
start();
